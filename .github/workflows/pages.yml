name: Deploy ICBC-TI Pages

# 把仓库里的 web/ 目录部署为 GitHub Pages
# 使用方式：仓库 Settings -> Pages -> Source 选择 "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:      # 允许在 Actions 页面手动点一次重新部署

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 web 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
